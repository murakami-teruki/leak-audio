<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部マイク入力テスト</title>
<style>
  :root { --bg:#111; --fg:#eee; --sub:#9aa; --ok:#4c8; --ng:#e55; --acc:#3af; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; font-size:15px; }
  h1 { font-size:18px; margin:0 0 12px; }
  button, select { font-size:16px; padding:10px 14px; margin:4px 0; width:100%; border-radius:8px; border:1px solid #444; background:#222; color:var(--fg); }
  button.primary { background:var(--acc); color:#000; border:none; font-weight:bold; }
  table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
  td { padding:4px 6px; border-bottom:1px solid #333; vertical-align:top; word-break:break-all; }
  td:first-child { color:var(--sub); width:42%; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  canvas { width:100%; height:180px; background:#000; display:block; margin-top:8px; border-radius:6px; }
  #meter { height:14px; background:#222; border-radius:7px; overflow:hidden; margin-top:8px; }
  #bar { height:100%; width:0; background:var(--ok); }
  #log { font-size:12px; color:var(--sub); white-space:pre-wrap; margin-top:8px; }
</style>
</head>
<body>
<h1>外部マイク入力テスト</h1>

<table id="env"></table>

<button class="primary" id="start">① マイク開始（許可ダイアログが出ます）</button>
<select id="dev" disabled><option>（開始後にデバイス一覧を表示）</option></select>
<button id="stop" disabled>停止</button>

<div id="meter"><div id="bar"></div></div>
<canvas id="cv"></canvas>
<table id="info"></table>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; };
const row = (t, k, v, cls='') => { t.insertAdjacentHTML('beforeend', `<tr><td>${k}</td><td class="${cls}">${v}</td></tr>`); };

// 環境チェック
const env = $('env');
row(env, 'URLスキーム', location.protocol);
row(env, 'セキュアコンテキスト', window.isSecureContext ? 'OK' : 'NG（マイク使用不可）', window.isSecureContext ? 'ok' : 'ng');
row(env, 'getUserMedia', navigator.mediaDevices?.getUserMedia ? 'あり' : 'なし', navigator.mediaDevices?.getUserMedia ? 'ok' : 'ng');
row(env, 'UserAgent', navigator.userAgent);

let ctx, stream, raf;

async function open(deviceId) {
  stop();
  const audio = {
    echoCancellation: false, noiseSuppression: false, autoGainControl: false,
    channelCount: 1
  };
  if (deviceId) audio.deviceId = { exact: deviceId };
  stream = await navigator.mediaDevices.getUserMedia({ audio });
  ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser();
  an.fftSize = 4096; an.smoothingTimeConstant = 0.6;
  src.connect(an);

  const tr = stream.getAudioTracks()[0];
  const s = tr.getSettings();
  const info = $('info'); info.innerHTML = '';
  row(info, '使用中デバイス', tr.label || '(ラベルなし)');
  row(info, 'サンプリング周波数', ctx.sampleRate + ' Hz');
  for (const k of ['echoCancellation', 'noiseSuppression', 'autoGainControl']) {
    const v = s[k];
    row(info, k, v === undefined ? '不明' : (v ? 'ON（要注意）' : 'OFF'), v ? 'ng' : 'ok');
  }

  await listDevices(s.deviceId);
  $('stop').disabled = false;
  draw(an);
}

async function listDevices(current) {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  const sel = $('dev'); sel.innerHTML = '';
  devs.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId; o.textContent = d.label || `入力 ${i + 1}`;
    if (d.deviceId === current) o.selected = true;
    sel.appendChild(o);
  });
  sel.disabled = false;
  log(`音声入力デバイス数: ${devs.length}`);
}

function draw(an) {
  const cv = $('cv'), g = cv.getContext('2d');
  const freq = new Float32Array(an.frequencyBinCount);
  const time = new Float32Array(an.fftSize);
  const nyq = ctx.sampleRate / 2, fMax = 5000;
  const loop = () => {
    cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
    an.getFloatFrequencyData(freq);
    an.getFloatTimeDomainData(time);
    // 入力レベル（RMS dBFS）
    let sum = 0; for (const x of time) sum += x * x;
    const db = 10 * Math.log10(sum / time.length + 1e-12);
    $('bar').style.width = Math.max(0, Math.min(100, (db + 90) / 90 * 100)) + '%';
    // スペクトル 0〜5kHz（-120〜0 dBFS）
    g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#3af'; g.lineWidth = 1.5 * devicePixelRatio; g.beginPath();
    const n = Math.floor(freq.length * fMax / nyq);
    for (let i = 0; i < n; i++) {
      const x = i / n * cv.width, y = (-freq[i] / 120) * cv.height;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
    g.fillStyle = '#9aa'; g.font = `${11 * devicePixelRatio}px sans-serif`;
    for (let f = 1000; f < fMax; f += 1000) g.fillText(f / 1000 + 'k', f / fMax * cv.width, cv.height - 4);
    g.fillText(`${db.toFixed(1)} dBFS`, 4, 14 * devicePixelRatio);
    raf = requestAnimationFrame(loop);
  };
  loop();
}

function stop() {
  cancelAnimationFrame(raf);
  stream?.getTracks().forEach(t => t.stop());
  ctx?.close(); ctx = stream = null;
  $('stop').disabled = true;
}

$('start').onclick = () => open().catch(e => log('エラー: ' + e.name + ' / ' + e.message));
$('dev').onchange = e => open(e.target.value).catch(err => log('エラー: ' + err.message));
$('stop').onclick = stop;
navigator.mediaDevices?.addEventListener?.('devicechange', () => log('デバイス接続状態が変化しました'));
</script>
</body>
</html>
